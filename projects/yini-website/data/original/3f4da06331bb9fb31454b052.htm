		《永远的夏娃》·雪人<br>
        <br>
        <br>
        飘雪的日子里<br>
        我依然孤傲雪中&nbsp;<br>
        弥漫胸怀的&nbsp; 都是<br>          
        无限温暖的秘密<br>
        <br>
        祈盼&nbsp; 成为那朵<br>          
        让你日夜呵护的花儿&nbsp;<br>
        还有生命里&nbsp; 为你<br>          
        迎风飘摇的绿叶<br>
        <br>
        梦想着和煦五月<br>
        熏香的风&nbsp; 还有<br>          
        六月里&nbsp; 为你<br>          
        娇柔灿烂的新娘<br>
        <br>
        今夜&nbsp; 我晕眩地渴望<br>          
        融在你的怀里&nbsp;<br>
        让冰冷的唇&nbsp; 化在<br>          
        你火热的心间<br>
