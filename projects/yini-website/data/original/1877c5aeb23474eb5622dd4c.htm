            <td width="59%" valign="middle">
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">神秘园是一支著名的新世纪音乐风格的乐队，它由挪威</span></font>
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">作曲家兼键盘手（罗尔夫.      
              劳弗兰）和爱尔兰女小提琴</span></font></p>
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">手（菲奥诺拉.莎莉）组成。1994年， 他们在欧洲歌唱<br>      
              <br>
              大赛中初次相遇，那时劳弗兰已是知名的词曲作家，由</span></font></p>
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">于对音乐有着难以想象的相同的理解，他们走到了一起</span></font></p>
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">。1995年，他们的探路之作《夜曲》一举夺得欧洲歌唱</span></font></p>
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">大赛冠军 1996年4月推出首张专辑《来自神秘园的歌》</span></font></p>     
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">大获成功，影响遍及世界各地。乐队溶合了爱尔兰空灵</span></font></p>
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">飘渺的乐风以及挪威民族音乐及古典音乐，乐曲恬静深</span></font></p>
              <p align="center"><font color="#DBDBDB"><span style="font-size: 9pt">远，自然流畅，使人不知不觉便已溶入其中。</span></font></p>
