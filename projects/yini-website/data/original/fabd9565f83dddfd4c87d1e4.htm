						<tr>
							<td> <font color="#663300">回忆 不眠的歌<br>

							爱河上的清歌<br>
							吟尽了千山的明月<br>
							唱遍&nbsp; 万水柔情<br>
							我的隔世繁华啊<br>
							<br>
							月光如洗&nbsp; 尽浣<br>
							三千群山兮<br>
							是什么分隔了彼此<br>
							相爱&nbsp; 不相惜<br>
							<br>
							匆匆而过&nbsp; 灯火<br>
							阑珊&nbsp; 月色依旧如虹<br>
							在心尖燃放<br>
							柔荑之间&nbsp; 蔓延<br>
							<br>
							等待&nbsp; 终究是黎明？<br>
