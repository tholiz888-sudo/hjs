                <b>《永远的夏娃》·婆娑</b><br>
                <br>
                回不去了&nbsp; 失落&nbsp;<br>   
                关山的明月&nbsp;<br>
                尽管重逢的记忆里<br>
                片片&nbsp; 枫叶情<br>   
                <br>
                咖啡的满与空之间<br>
				流星悄然&nbsp; 画过 <br>
				迷雾的瞳子 <br>
				明静如水的脸庞 <br>
                <br>
                婆娑&nbsp; 不是昨夜<br>   
                漾在心湖里的月光<br>
                也不是&nbsp; 今夜<br>   
                踟躇月下的背影<br>
                <br>
                那是&nbsp; 凝在目光<br>    
                春江秋水的柔波啊<br>
