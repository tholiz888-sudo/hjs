services:
  - type: web
    name: crypto-position-calculator
    runtime: node
    plan: free
    rootDir: position-calculator
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
