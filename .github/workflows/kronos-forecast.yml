name: Kronos 在线生成预测
run-name: "Kronos ${{ inputs.symbol || 'BTCUSDT' }} · ${{ inputs.interval || '1h' }} [${{ inputs.request_id || github.run_number }}]"

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 交易对
        type: choice
        default: BTCUSDT
        options: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
      interval:
        description: K 线周期
        type: choice
        default: 1h
        options: [15m, 1h, 4h, 1d]
      paths:
        description: 独立预测路径数
        type: choice
        default: '3'
        options: ['2', '3', '5']
      request_id:
        description: 网站请求标识（手动运行时留空）
        type: string
        required: false
  # First publication generates a result automatically. Result commits do not loop.
  push:
    branches: [main]
    paths: [.github/workflows/kronos-forecast.yml]

permissions:
  contents: write

concurrency:
  group: kronos-forecast
  cancel-in-progress: false

jobs:
  forecast:
    # Never allocate a runner for private repositories; no paid/large runners.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_BRANCH: codex/kronos-render-free
      INPUT_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
      INPUT_INTERVAL: ${{ inputs.interval || '1h' }}
      INPUT_PATHS: ${{ inputs.paths || '3' }}
    steps:
      - name: Checkout the existing Render branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/kronos-render-free
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Configure ephemeral model and plotting caches
        run: |
          python - <<'PYENV'
          import os
          from pathlib import Path
          values = {
              'KRONOS_REPO': str(Path(os.environ['GITHUB_WORKSPACE']) / '.local/kronos/Kronos'),
              'HF_HOME': str(Path(os.environ['RUNNER_TEMP']) / 'kronos-cache'),
              'MPLCONFIGDIR': str(Path(os.environ['RUNNER_TEMP']) / 'kronos-mpl'),
              'XDG_CACHE_HOME': str(Path(os.environ['RUNNER_TEMP']) / 'kronos-xdg'),
          }
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              for key, value in values.items():
                  env_file.write(f'{key}={value}\n')
          PYENV
      - name: Install verified CPU dependencies
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r kronos-render/requirements.txt
          python -m pip check
      - name: Checkout the pinned upstream model code
        run: |
          mkdir -p .local/kronos
          git clone https://github.com/shiyu-coder/Kronos.git "$KRONOS_REPO"
          git -C "$KRONOS_REPO" checkout --detach 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          test "$(git -C "$KRONOS_REPO" rev-parse HEAD)" = 67b630e67f6a18c9e9be918d9b4337c960db1e9a
      - name: Fetch 512 closed candles and predict 24 future candles
        run: |
          python kronos-render/forecast.py --symbol "$INPUT_SYMBOL" --interval "$INPUT_INTERVAL" --paths "$INPUT_PATHS" --output "$RUNNER_TEMP/kronos-output"
          python kronos-render/publish.py "$RUNNER_TEMP/kronos-output/forecast.json" --destination "$RUNNER_TEMP/kronos-validated.json"
      - name: Publish only the validated prediction to Render's branch
        run: bash kronos-render/ci-publish.sh
