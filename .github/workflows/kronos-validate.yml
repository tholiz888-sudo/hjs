# Includes all retained original Git prediction snapshots, including the initial backfill.
name: Kronos 更新预测与实际对照
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/kronos-validate.yml]
permissions:
  contents: write
concurrency:
  group: kronos-forecast
  cancel-in-progress: false
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/kronos-render-free
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install public market API client
        run: python -m pip install 'requests>=2.32,<3'
      - name: Match later closed candles and publish validation
        run: bash kronos-render/ci-validate.sh
