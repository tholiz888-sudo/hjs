<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板内容配置</title><link rel="stylesheet" href="template.css"></head><body><main class="editor"><h1>模板内容配置</h1><p class="editor-help">填写你自己的站名、栏目和文章，然后点击“导出配置文件”。将下载的 <b>content.js</b> 放回此文件所在文件夹，替换原文件，再刷新首页即可。此工具不会联网，也不会自动修改你的电脑文件。</p><p><a href="index.html" target="_blank" rel="noopener">打开首页预览</a></p><form id="editor"><fieldset><legend>网站信息</legend><div class="editor-grid"><label>网站名称<input id="site-name" required></label><label>一句话介绍<input id="site-tagline" required></label><label>联系方式<input id="site-contact"></label><label>版权文字<input id="site-copyright"></label></div><label>网站介绍<textarea id="site-intro" required></textarea></label><label>欢迎区标题<input id="welcome-title"></label><label>欢迎区正文（每段之间空一行）<textarea id="welcome"></textarea></label></fieldset><fieldset><legend>栏目与侧栏</legend><div class="editor-grid"><label>顶部导航名称（每行一个，保留现有页面链接）<textarea id="navigation"></textarea></label><label>分类名称（每行一个，按当前顺序）<textarea id="categories"></textarea></label><label>公告（每行一个）<textarea id="notices"></textarea></label><label>常用链接名称（每行一个）<textarea id="tools"></textarea></label></div></fieldset><fieldset><legend>文章内容</legend><label>选择文章<select id="article-select"></select></label><div class="editor-grid"><label>文章标题<input id="article-title" required></label><label>所属栏目<select id="article-category"></select></label><label>发布日期<input id="article-date" type="date"></label><label>文章 ID（用于链接）<input id="article-id" readonly></label></div><label>摘要<textarea id="article-summary"></textarea></label><label>正文（每段之间空一行）<textarea id="article-body" style="min-height:200px"></textarea></label><button id="add-article" type="button" class="secondary">添加文章</button></fieldset><button type="submit">导出配置文件</button><button id="reset" type="button" class="secondary">恢复当前文件内容</button><p class="status" id="status" role="status"></p></form></main><script src="content.js"></script><script src="editor.js"></script></body></html>
