services:
  - type: web
    name: polymarket-paper-lab
    runtime: node
    plan: free
    rootDir: polymarket-lab
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: HOST
        value: 0.0.0.0
