 <b>
 <font  color="#D6CF94">《永远的夏娃》·遗憾</font> 
            </font> 
            </b> 
            <p><br>
            <font  color="#D6CF94">当凄怨的冷雨&nbsp;<br>
            爬上了迷雾的眼睛&nbsp;<br>
            还有谁&nbsp; 可以&nbsp;<br>
            再说自欺的话语</font></p>
            <p><font  color="#D6CF94">当曾经的温情&nbsp;<br>
            高筑起伤感的藩篱&nbsp;<br>
            忠诚的心&nbsp; 迷失&nbsp;<br>
            风中的尘埃&nbsp;</font></p>
            <p><font color="#D6CF94">月光 &nbsp;黯然隐没&nbsp;<br>
            星光悄悄湮灭&nbsp;<br>
            所谓的誓言&nbsp; 只剩下&nbsp;<br>
            一副剔透的外壳&nbsp;</font></p>
            <p><font  color="#D6CF94">于是&nbsp; 无言陨落<br>
            绝伦千山的明月啊&nbsp;<br>
            因此遗失了 &nbsp;永远&nbsp;<br>
            不够爱的“你”<br>
            </font></p>
